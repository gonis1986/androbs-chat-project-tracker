<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatProjectTracker - connectors, upvotes & overlay tests</title>
  <link rel="stylesheet" href="../chat_project_tracker.css">
  <style>
    body { font-family: monospace; background: #0c0f17; color: #e5e7eb; padding: 20px; }
    .pass { color: #34d399; } .fail { color: #ef4444; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Connectors, upvotes &amp; overlay tests</h1>
  <div id="summary">running...</div>
  <pre id="results"></pre>
  <script src="../i18n.js"></script>
  <script src="../chat_connectors.js"></script>
  <script src="../chat_project_tracker.js"></script>
  <script>
    const lines = [];
    let pass = 0, total = 0;
    function check(name, actual, expected) {
      total++;
      const ok = JSON.stringify(actual) === JSON.stringify(expected);
      if (ok) pass++;
      lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}${ok ? '' : `\n     got ${JSON.stringify(actual)}, expected ${JSON.stringify(expected)}`}`);
    }
    const pick = (o, keys) => o && Object.fromEntries(keys.map(k => [k, o[k]]));
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    (async () => {
      cptSetLanguage('en', { persist: false });

      // ---------- Twitch adapter ----------
      const tw = TwitchAdapter.parseLine('@badge-info=;color=#FF7F50;display-name=Night\\sOwl;id=abc-123;tmi-sent-ts=1700000000000 :nightowl!nightowl@nightowl.tmi.twitch.tv PRIVMSG #androbs :I built a tool: https://x.vercel.app');
      check('twitch: tags, escaped display-name, text', pick(tw, ['id', 'author', 'text', 'color', 'timestamp', 'platform', 'channel']),
        { id: 'tw_abc-123', author: 'Night Owl', text: 'I built a tool: https://x.vercel.app', color: '#FF7F50', timestamp: 1700000000000, platform: 'twitch', channel: 'androbs' });
      check('twitch: /me ACTION unwrapped', TwitchAdapter.parseLine(':bob!bob@bob.tmi.twitch.tv PRIVMSG #a :\u0001ACTION check out my repo\u0001').text, 'check out my repo');
      check('twitch: no tags -> login as author', TwitchAdapter.parseLine(':bob!bob@bob.tmi.twitch.tv PRIVMSG #a :hi').author, 'bob');
      check('twitch: PING ignored', TwitchAdapter.parseLine('PING :tmi.twitch.tv'), null);
      check('twitch: JOIN ignored', TwitchAdapter.parseLine(':bob!bob@bob.tmi.twitch.tv JOIN #a'), null);

      // ---------- Kick adapter ----------
      const kickFrame = JSON.stringify({
        event: 'App\\Events\\ChatMessageEvent', channel: 'chatrooms.668.v2',
        data: JSON.stringify({ id: 'k-1', chatroom_id: 668, content: 'mira mi proyecto [emote:37226:KEKW] github.com/a/b', type: 'message',
          created_at: '2026-10-07T10:00:00Z', sender: { id: 5, username: 'KickDev', slug: 'kickdev', identity: { color: '#53FC18', badges: [] } } })
      });
      check('kick: pusher frame string, emotes -> names', pick(KickAdapter.parse(kickFrame), ['id', 'author', 'text', 'color', 'timestamp', 'platform']),
        { id: 'kick_k-1', author: 'KickDev', text: 'mira mi proyecto KEKW github.com/a/b', color: '#53FC18', timestamp: Date.parse('2026-10-07T10:00:00Z'), platform: 'kick' });
      check('kick: inner message object accepted', KickAdapter.parse({ content: '!vote 2', sender: { username: 'z' } }).text, '!vote 2');
      check('kick: non-chat events ignored', KickAdapter.parse({ event: 'App\\Events\\UserBannedEvent', data: '{}' }), null);
      check('kick: pusher system frames ignored', KickAdapter.parse('{"event":"pusher:connection_established","data":"{}"}'), null);
      check('kick: invalid JSON ignored', KickAdapter.parse('not json'), null);

      // ---------- YouTube adapter ----------
      const yt = YouTubeAdapter.parse({ id: 'LCC.1', snippet: { publishedAt: '2026-10-07T10:00:00Z', displayMessage: 'ho creato un sito' },
        authorDetails: { displayName: '@Luca', isChatModerator: true } });
      check('youtube: liveChatMessage, @ stripped, mod color', pick(yt, ['id', 'author', 'text', 'color', 'platform']),
        { id: 'yt_LCC.1', author: 'Luca', text: 'ho creato un sito', color: '#60a5fa', platform: 'youtube' });
      check('youtube: superchat comment fallback', YouTubeAdapter.parse({ snippet: { superChatDetails: { userComment: '+1' } }, authorDetails: { displayName: 'A' } }).text, '+1');
      check('youtube: empty item ignored', YouTubeAdapter.parse({ snippet: { type: 'tombstone' } }), null);
      check('youtube: video ids', [
        'https://www.youtube.com/watch?v=dQw4w9WgXcQ&t=3', 'https://youtu.be/dQw4w9WgXcQ', 'youtube.com/live/dQw4w9WgXcQ?si=x', 'dQw4w9WgXcQ', 'nope'
      ].map(v => YouTubeAdapter.parseVideoId(v)), ['dQw4w9WgXcQ', 'dQw4w9WgXcQ', 'dQw4w9WgXcQ', 'dQw4w9WgXcQ', '']);
      check('connector factory', ['twitch', 'kick', 'youtube'].map(p => createChatConnector(p, {}).constructor.name),
        ['TwitchConnector', 'KickConnector', 'YouTubeConnector']);

      // ---------- Vote parsing ----------
      const t = new ChatProjectTracker({ containerId: '__none__', persist: false, overlayDuration: 300 });
      check('parseVote', ['!vote 1', '!upvote #12', '!VOTO 3', '!vota 4 grande', '+1', '+1 great idea', '+ 1', '+10 points', '+1.5', '!vote', 'vote 1'].map(x => t.parseVote(x)),
        [{ num: 1 }, { num: 12 }, { num: 3 }, { num: 4 }, { plusOne: true }, { plusOne: true }, { plusOne: true }, null, null, null, null]);

      // ---------- Upvotes ----------
      t.processMessage({ id: 'a', author: 'A', text: '!project Alpha - first', platform: 'twitch' });
      t.processMessage(KickAdapter.parse(kickFrame));
      t.processMessage(yt);
      const byNum = n => t.projects.find(p => p.num === n);
      check('projects numbered #1..#3', t.projects.map(p => p.num), [3, 2, 1]);
      check('platform stored on projects', [1, 2, 3].map(n => byNum(n).platform), ['twitch', 'kick', 'youtube']);
      check('!vote 1 counts', t.processMessage({ author: 'V1', text: '!vote 1', platform: 'twitch' }), true);
      check('same viewer cannot vote twice', t.processMessage({ author: 'v1', text: '!upvote 1', platform: 'twitch' }), false);
      check('same name on another platform is a different viewer', t.processMessage({ author: 'V1', text: '!upvote #1', platform: 'kick' }), true);
      check('unknown id ignored', t.processMessage({ author: 'V2', text: '!vote 99' }), false);
      check('vote commands never become projects', t.projects.length, 3);
      t.processMessage({ author: 'V3', text: '+1', platform: 'youtube' });
      check('+1 goes to the newest project when nothing is on stream', [1, 2, 3].map(n => byNum(n).votes), [2, 0, 1]);
      check('voters recorded', byNum(1).voters, ['twitch:v1', 'kick:v1']);

      // ---------- Sorting ----------
      t.processMessage({ author: 'V4', text: '!vote 2' });
      t.processMessage({ author: 'V5', text: '!vote 2' });
      t.processMessage({ author: 'V6', text: '!vote 2' });
      t.setSort('votes');
      check('sort by most upvoted', t.getFilteredProjects().map(p => p.num), [2, 1, 3]);
      t.setSort('newest');
      check('sort by newest', t.getFilteredProjects().map(p => p.num), [3, 2, 1]);
      t.deleteProject(byNum(3).id);
      t.processMessage({ id: 'd', author: 'D', text: '!idea Delta bot' });
      check('numbers are not reused after delete', t.projects[0].num, 4);

      // ---------- Overlay ----------
      t.processMessage({ id: 'x', author: 'Eve<script>', text: '!project <img src=x onerror=alert(1)> - check https://github.com/eve/xss' });
      const xss = t.projects[0];
      check('showOnStream returns true', t.showOnStream(xss.id), true);
      const ov = document.querySelector('.cpt-overlay');
      check('overlay rendered and sliding in', !!ov && ov.classList.contains('cpt-overlay-in'), true);
      check('overlay uses the item category theme', [ov.classList.contains('cpt-cat-tech'), ov.querySelector('.cpt-overlay-live').textContent.trim()], [true, 'Tech & Code']);
      check('overlay escapes chat content', [ov.querySelector('.cpt-overlay-title').textContent, ov.querySelectorAll('img, script').length], ['<img src=x onerror=alert(1)>', 0]);
      check('overlay link is clickable', ov.querySelector('.cpt-overlay-link').getAttribute('href'), 'https://github.com/eve/xss');
      check('overlay shows author', ov.querySelector('.cpt-overlay-author').textContent.trim(), 'by @Eve<script>');
      t.processMessage({ author: 'V7', text: '+1' });
      t.processMessage({ author: 'V8', text: '+1' });
      check('+1 goes to the on-stream project', xss.votes, 2);
      check('overlay vote badge updates live', ov.querySelector('.cpt-overlay-votes').textContent, '▲ 2');
      t.showOnStream(byNum(1).id);
      check('showing another project replaces the overlay', [document.querySelectorAll('.cpt-overlay-in').length, t.onAirId], [1, byNum(1).id]);
      await sleep(450);
      check('overlay auto-hides after overlayDuration', [t.onAirId, document.querySelectorAll('.cpt-overlay-in').length], [null, 0]);
      await sleep(800);
      check('overlay element removed after fade-out', document.querySelectorAll('.cpt-overlay').length, 0);

      // ---------- Categories, Stream Mode & themed overlay ----------
      const c = new ChatProjectTracker({ containerId: '__none__', persist: false, overlayDuration: 300 });
      c.processMessage({ id: 'g', author: 'G', text: 'You should play Hades II next! https://store.steampowered.com/app/1145350/Hades_II/' });
      check('steam suggestion -> gaming', pick(c.projects[0], ['category', 'title', 'tags']), { category: 'gaming', title: 'Hades II', tags: ['Steam'] });
      c.setStreamMode('gaming');
      check('stream mode skips off-theme items', [c.processMessage({ id: 'e', author: 'E', text: '!art Clay Frog - handmade' }), c.projects.length, c.skippedCount], [false, 1, 1]);
      check('stream mode keeps on-theme items', c.processMessage({ id: 'g2', author: 'H', text: '!game Balatro - poker roguelike' }), true);
      check('votes still count in stream mode', c.processMessage({ author: 'V', text: '!vote 1' }), true);
      c.setStreamMode('all');
      check('switching mode resets the skipped counter', c.skippedCount, 0);
      c.processMessage({ id: 'e2', author: 'E', text: '!art Clay Frog - handmade' });
      c.setCategoryFilter('art');
      check('category filter', c.getFilteredProjects().map(p => p.title), ['Clay Frog']);
      c.setCategoryFilter('art');
      check('clicking the active category again shows all', c.getFilteredProjects().length, 3);
      c.setSearch('gaming');
      check('search matches category names', c.getFilteredProjects().map(p => p.title), ['Balatro', 'Hades II']);
      c.setSearch('');
      c.showOnStream(c.projects.find(p => p.title === 'Clay Frog').id);
      let ovc = document.querySelector('.cpt-overlay.cpt-overlay-in');
      check('overlay uses the handmade & art theme', [ovc.classList.contains('cpt-cat-art'), ovc.querySelector('.cpt-overlay-live').textContent.trim(), ovc.querySelector('.cpt-overlay-icon').textContent.trim(), ovc.querySelector('.cpt-overlay-cat').textContent.trim()],
        [true, 'Handmade & Art', '🎨', '🎨 Handmade & Art']);
      c.showOnStream(c.projects.find(p => p.title === 'Hades II').id);
      ovc = document.querySelector('.cpt-overlay.cpt-overlay-in');
      check('overlay switches to the gaming theme', [ovc.classList.contains('cpt-cat-gaming'), ovc.classList.contains('cpt-cat-art'), ovc.querySelector('.cpt-overlay-live').textContent.trim(), ovc.querySelector('.cpt-overlay-icon').textContent.trim()],
        [true, false, 'Game Suggestion', '🎮']);
      check('themed accent colors differ per category', getComputedStyle(ovc).getPropertyValue('--cat-a').trim(), '#39ff14');
      c.hideOverlay();
      await sleep(800);

      // ---------- Persistence of votes ----------
      const key = '__cpt_test_' + Date.now();
      const p1 = new ChatProjectTracker({ containerId: '__none__', storageKey: key });
      p1.processMessage({ id: 'p', author: 'P', text: '!project Persisted' });
      p1.processMessage({ author: 'Q', text: '!vote 1' });
      p1.setSort('votes');
      p1.setStreamMode('tech');
      const p2 = new ChatProjectTracker({ containerId: '__none__', storageKey: key });
      check('votes, voters, number, sort, category & stream mode survive reload',
        [p2.projects[0].votes, p2.projects[0].voters, p2.projects[0].num, p2.sortMode, p2.seq, p2.projects[0].category, p2.streamMode],
        [1, ['chat:q'], 1, 'votes', 1, 'tech', 'tech']);
      localStorage.setItem(key, JSON.stringify([{ id: 'old1', author: 'o', title: 'Old', description: 'x', timestamp: 1 }, { id: 'old2', author: 'o', title: 'Old2', description: 'y', timestamp: 2 }]));
      localStorage.removeItem(key + '_meta');
      const p3 = new ChatProjectTracker({ containerId: '__none__', storageKey: key });
      check('legacy saved projects get numbers oldest-first and 0 votes', p3.projects.map(p => [p.id, p.num, p.votes]), [['old1', 1, 0], ['old2', 2, 0]]);
      localStorage.setItem(key, JSON.stringify([
        { id: 'l1', author: 'o', title: 'x', description: 'my game https://store.steampowered.com/app/1/X/', url: 'https://store.steampowered.com/app/1/X/', timestamp: 1 },
        { id: 'l2', author: 'o', title: 'y', description: 'idea', tags: ['Idea'], timestamp: 2 },
        { id: 'l3', author: 'o', title: 'z', description: 'repo', url: 'https://github.com/a/b', timestamp: 3 }
      ]));
      const p4 = new ChatProjectTracker({ containerId: '__none__', storageKey: key });
      check('legacy saved projects get a category', p4.projects.map(p => p.category), ['gaming', 'idea', 'tech']);
      localStorage.removeItem(key); localStorage.removeItem(key + '_meta');

      // ---------- i18n ----------
      const langs = Object.keys(CPT_LANGUAGES);
      const enKeys = Object.keys(CPT_I18N.en);
      const baseKey = k => k.replace(/\.(one|other)$/, '');
      const placeholders = v => (v.match(/\{\w+\}/g) || []).sort().join(',');
      check('languages offered', langs, ['it', 'es', 'en', 'ja']);
      check('every language has every key', langs.map(l => [l, enKeys.filter(k => !(k in CPT_I18N[l]) && !(baseKey(k) in CPT_I18N[l]))]), langs.map(l => [l, []]));
      check('no keys missing from English', langs.map(l => [l, Object.keys(CPT_I18N[l]).filter(k => !(k in CPT_I18N.en) && !enKeys.some(e => baseKey(e) === k))]), langs.map(l => [l, []]));
      check('placeholders match English', langs.map(l => [l, Object.keys(CPT_I18N[l]).filter(k => {
        const en = CPT_I18N.en[k] || CPT_I18N.en[`${k}.other`];
        return placeholders(CPT_I18N[l][k]) !== placeholders(en);
      })]), langs.map(l => [l, []]));
      check('plurals, params and fallbacks', [cptT('count.items', { n: 1 }), cptT('count.items', { n: 3 }), cptT('count.items', { n: 3 }, 'ja'), cptT('count.items', { n: 1 }, 'it'), cptT('no.such.key')],
        ['1 Item', '3 Items', '3 件', '1 elemento', 'no.such.key']);

      const i18nRoot = document.createElement('div');
      i18nRoot.id = '__i18n_root';
      document.body.appendChild(i18nRoot);
      const li = new ChatProjectTracker({ containerId: '__i18n_root', persist: false, overlayDuration: 300 });
      li.processMessage({ id: 'j1', author: 'Yuki', text: '!game Celeste' });
      li.setStreamMode('gaming');
      const q = sel => i18nRoot.querySelector(sel);
      const txt = sel => q(sel).textContent.replace(/\s+/g, ' ').trim();
      cptSetLanguage('ja', { persist: false });
      check('widget re-renders in Japanese', [txt('.cpt-title'), txt('#cpt-counter'), txt('[data-category="gaming"]'), txt('.cpt-btn-stream'), txt('#cpt-stream-mode option[value="gaming"]'), q('#cpt-stream-mode').value, q('#cpt-lang').value, document.documentElement.lang],
        ['ライブショーケース＆コミュニティキュー', '1 件', '🎮 ゲーム 1', '📺 配信に表示', '今日は 🎮 ゲーム のみ', 'gaming', 'ja', 'ja']);
      li.showOnStream('j1');
      const ovj = document.querySelector('.cpt-overlay.cpt-overlay-in');
      check('overlay labels follow the language', [ovj.querySelector('.cpt-overlay-live').textContent.trim(), ovj.querySelector('.cpt-overlay-cat').textContent.trim(), ovj.querySelector('.cpt-overlay-author').textContent.trim()],
        ['おすすめゲーム', '🎮 ゲーム', '投稿：@Yuki']);
      li.hideOverlay();
      cptSetLanguage('it', { persist: false });
      li.processMessage({ author: 'A', text: '!art Vaso in ceramica' });
      check('Italian stream-mode note and counter', [txt('#cpt-mode-note'), txt('#cpt-counter'), txt('[data-action="clear-all"]')], ['Fuori tema scartati: 1', '1 elemento', '🗑 Svuota tutto']);
      li.setSearch('games');
      const foundEn = li.getFilteredProjects().length;
      li.setSearch('ゲーム');
      const foundJa = li.getFilteredProjects().length;
      li.setSearch('celeste');
      cptSetLanguage('ja', { persist: false });
      check('category search works in any language; query survives a language switch', [foundEn, foundJa, q('#cpt-search').value, li.getFilteredProjects().length], [1, 1, 'celeste', 1]);
      li.setSearch('');
      cptSetLanguage('es');
      li.toggleStatus('j1');
      check('Spanish markdown + language saved', [li.toMarkdown(li.projects.filter(p => p.status === 'reviewed')), localStorage.getItem(CPT_LANGUAGE_KEY), cptDetectLanguage()],
        ['- **Celeste** de @Yuki: Celeste', 'es', 'es']);
      localStorage.removeItem(CPT_LANGUAGE_KEY);
      cptSetLanguage('en', { persist: false });
      check('back to English', txt('.cpt-title'), 'Live Showcase & Community Queue');
      await sleep(800);
      i18nRoot.remove();

      document.getElementById('results').innerHTML = lines
        .map(l => `<span class="${l.startsWith('PASS') ? 'pass' : 'fail'}">${l.replace(/</g, '&lt;')}</span>`).join('\n');
      document.getElementById('summary').innerHTML =
        `<b class="${pass === total ? 'pass' : 'fail'}" id="result-line">RESULT: ${pass}/${total} passed</b>`;
    })().catch(e => { document.getElementById('summary').textContent = 'ERROR: ' + e.stack; });
  </script>
</body>
</html>
